<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SwaadPe | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white p-6 rounded-xl shadow w-full max-w-sm">
    <h1 class="text-2xl font-bold mb-4 text-center">🔐 Login to SwaadPe</h1>

    <input id="email" type="email" placeholder="Email"
      class="w-full border p-2 rounded mb-3" />

    <input id="password" type="password" placeholder="Password"
      class="w-full border p-2 rounded mb-4" />

    <button onclick="login()"
      class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-700">
      Login
    </button>

    <p id="msg" class="text-center mt-3"></p>

    <p class="text-center mt-4 text-sm">
      Don’t have an account?
      <a href="register.html" class="text-green-600 font-semibold">Register</a>
    </p>
  </div>

  <script>
    const API = "http://127.0.0.1:8000";

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const form = new URLSearchParams();
      form.append("username", email);
      form.append("password", password);

      const res = await fetch(`${API}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: form
      });

      const msg = document.getElementById("msg");

      if (!res.ok) {
        msg.textContent = "❌ Invalid credentials";
        msg.className = "text-red-600";
        return;
      }

      const data = await res.json();
      localStorage.setItem("token", data.access_token);

      // decode JWT payload (basic)
      const payload = JSON.parse(atob(data.access_token.split(".")[1]));

      if (payload.role === "admin") {
        window.location.href = "admin.html";
      } else {
        window.location.href = "calendar.html";
      }
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SwaadPe | My Tiffin Calendar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-4">

  <!-- Header -->
  <div class="max-w-5xl mx-auto">
    <h1 class="text-2xl font-bold text-center mb-6">
      🍱 SwaadPe – My Tiffin Calendar
    </h1>

    <!-- Calendar Grid -->
    <div id="calendar"
         class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
    </div>
  </div>

  <!-- JS Logic -->
  <script>
    // =========================
    // CONFIG
    // =========================
    const API_BASE = "http://127.0.0.1:8000";

    // =========================
    // LOAD CALENDAR
    // =========================
    async function loadCalendar() {
      const token = localStorage.getItem("token");

      if (!token) {
        alert("Token not found. Please login first.");
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/tiffin/calendar`, {
          method: "GET",
          headers: {
            "Authorization": "Bearer " + token,
            "Accept": "application/json"
          }
        });

        if (!response.ok) {
          alert("Session expired or unauthorized. Please login again.");
          return;
        }

        const data = await response.json();
        renderCalendar(data);

      } catch (error) {
        console.error(error);
        alert("Failed to load calendar.");
      }
    }

    // =========================
    // RENDER CALENDAR
    // =========================
    function renderCalendar(days) {
      const calendar = document.getElementById("calendar");
      calendar.innerHTML = "";

      days.forEach(day => {
        const card = document.createElement("div");
        card.className =
          "bg-white rounded-xl shadow-md p-4 border hover:shadow-lg transition";

        card.innerHTML = `
          <div class="text-lg font-semibold mb-2">
            📅 ${day.date}
          </div>

          <div class="flex justify-between items-center mb-1">
            <span>🍛 Lunch</span>
            <span class="font-semibold ${
              day.lunch ? "text-green-600" : "text-red-500"
            }">
              ${day.lunch ? "Delivered" : "Pending"}
            </span>
          </div>

          <div class="flex justify-between items-center">
            <span>🍽️ Dinner</span>
            <span class="font-semibold ${
              day.dinner ? "text-green-600" : "text-red-500"
            }">
              ${day.dinner ? "Delivered" : "Pending"}
            </span>
          </div>
        `;

        calendar.appendChild(card);
      });
    }

    // =========================
    // INIT
    // =========================
    loadCalendar();
  </script>

</body>
</html>

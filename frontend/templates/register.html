<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SwaadPe | Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white p-6 rounded-xl shadow w-full max-w-sm">
    <h1 class="text-2xl font-bold mb-4 text-center">📝 Create Account</h1>

    <input id="name" type="text" placeholder="Name"
      class="w-full border p-2 rounded mb-3" />

    <input id="email" type="email" placeholder="Email"
      class="w-full border p-2 rounded mb-3" />

    <input id="password" type="password" placeholder="Password"
      class="w-full border p-2 rounded mb-4" />

    <button onclick="register()"
      class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-700">
      Register
    </button>

    <p id="msg" class="text-center mt-3"></p>

    <p class="text-center mt-4 text-sm">
      Already have an account?
      <a href="login.html" class="text-green-600 font-semibold">Login</a>
    </p>
  </div>

  <script>
    const API = "http://127.0.0.1:8000";

    async function register() {
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const res = await fetch(`${API}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, password })
      });

      const msg = document.getElementById("msg");

      if (!res.ok) {
        msg.textContent = "❌ Registration failed";
        msg.className = "text-red-600";
        return;
      }

      msg.textContent = "✅ Registered! Redirecting to login...";
      msg.className = "text-green-600";

      setTimeout(() => {
        window.location.href = "login.html";
      }, 1500);
    }
  </script>

</body>
</html>
